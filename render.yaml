databases:
  - name: persons-db
    databaseName: persons
    user: program
    plan: free

services:
  - type: web
    name: person-service
    runtime: image
    plan: free
    image:
      url: ghcr.io/aivanspooky/rsoi-lab1:latest
    healthCheckPath: /manage/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: persons-db
          property: connectionString
